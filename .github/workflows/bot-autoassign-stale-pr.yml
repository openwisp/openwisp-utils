name: Stale PR Management
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: bot-autoassign-stale-pr-${{ github.repository }}
  cancel-in-progress: false
jobs:
  manage-stale-prs-python:
    if: github.repository == 'openwisp/openwisp-utils'
    permissions:
      contents: read
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-autoassign.yml@719b0b61df04e63c11deb48f7f9562d23df01f4b # 0.2.0
    with:
      bot_command: stale_pr
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
