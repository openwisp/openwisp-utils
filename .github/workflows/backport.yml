name: Backport fixes to stable branch

on:
  push:
    branches:
      - master
  issue_comment: # zizmor: ignore[dangerous-triggers] Required for member or owner backport commands on merged PRs; branch names are validated.
    types: [created]

permissions: {}

concurrency:
  group: backport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backport-on-push:
    if: >
      github.repository == 'openwisp/openwisp-utils' &&
      github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read # Resolves the merged pull request from a pushed commit.
    uses: $/.github/workflows/reusable-backport.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets:
      app_id: ${{ secrets.OPENWISP_BOT_APP_ID }}
      private_key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}

  backport-on-comment:
    if: >
      github.repository == 'openwisp/openwisp-utils' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.pull_request.merged_at != null &&
      github.event.issue.state == 'closed' &&
      contains(fromJSON('["MEMBER", "OWNER"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/backport')
    permissions:
      contents: read
      pull-requests: read # Resolves the merge commit before handling a backport command.
    uses: $/.github/workflows/reusable-backport.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      comment_body: ${{ github.event.comment.body }}
    secrets:
      app_id: ${{ secrets.OPENWISP_BOT_APP_ID }}
      private_key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
