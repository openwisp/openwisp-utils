name: Replicate Commits to Version Branch

on:
  workflow_call:
    inputs:
      module_name:
        description: "The name of the module"
        required: true
        type: string
      install_package:
        description: "Whether to install the package"
        required: false
        type: boolean
        default: false
    secrets:
      client_id:
        required: true
      private_key:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install package if required
        if: inputs.install_package
        run: |
          pip install .

      - name: Get version
        id: get_version
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: |
          python - <<'PY'
          import importlib
          import os

          version = importlib.import_module(os.environ["MODULE_NAME"]).VERSION
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version[0]}.{version[1]}\n")
          PY

  replicate:
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward version branch
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/$VERSION"; then
            git checkout -B "$VERSION" "origin/$VERSION"
            # Delayed runs are no-ops; divergence fails without rewriting history.
            if ! git merge --ff-only "$GITHUB_SHA"; then
              echo "::error::Version branch '$VERSION' has diverged from master. Follow the documented manual recovery procedure." >&2
              exit 1
            fi
          else
            # The normal push creates a missing remote version branch.
            git checkout -b "$VERSION" "$GITHUB_SHA"
          fi

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # GitHub requires Workflows: write when a push changes .github/workflows/.
          permission-workflows: write

      - name: Push version branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh auth setup-git
          git push origin "$VERSION"
