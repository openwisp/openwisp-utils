name: Replicate Commits to Version Branch

on:
  workflow_call:
    inputs:
      module_name:
        description: "The name of the module"
        required: true
        type: string
      install_package:
        description: "Whether to install the package"
        required: false
        type: boolean
        default: false
    secrets:
      OPENWISP_BOT_APP_ID:
        required: true
      OPENWISP_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install package if required
        if: inputs.install_package
        run: |
          pip install .

      - name: Get version
        id: get-version
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: |
          python - <<'PY'
          import importlib
          import os
          import re

          name = os.environ["MODULE_NAME"]
          if not re.fullmatch(r"[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*", name):
              raise ValueError("Invalid Python module name")
          version = importlib.import_module(name).VERSION
          major, minor = version[:2]
          if any(type(part) is not int or part < 0 for part in (major, minor)):
              raise ValueError("Version must start with non-negative integers")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={major}.{minor}\n")
          PY

  replicate:
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: openwisp-bot
    concurrency:
      group: version-branch-${{ github.repository }}-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name 'OpenWISP Companion'
          git config user.email 'support@openwisp.io'

      - name: Rebase changes onto version branch
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/$VERSION"; then
            git checkout -b "$VERSION" "origin/$VERSION"
            git rebase "$GITHUB_SHA"
          else
            git checkout -b "$VERSION"
          fi

      - name: Generate replication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OPENWISP_BOT_APP_ID }}
          private-key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push version branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$VERSION"
