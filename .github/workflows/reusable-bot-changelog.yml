name: Reusable Changelog Bot

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        description: "Google Gemini API key"
        required: true
      OPENWISP_BOT_APP_ID:
        description: "GitHub App ID for OpenWISP Bot"
        required: true
      OPENWISP_BOT_PRIVATE_KEY:
        description: "Private key for GitHub App authentication"
        required: true

permissions: {}

jobs:
  generate-changelog:
    name: Generate changelog entry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The generator reads the PR diff and changelog format from this checkout.
      # It does not execute files from the PR.
      - name: Checkout PR repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.OPENWISP_BOT_APP_ID }}
          private-key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
          permission-issues: read
          permission-pull-requests: write

      - name: Generate changelog
        uses: $/.github/actions/bot-changelog-generator
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          pr-number: ${{ inputs.pr_number }}
          repo-name: ${{ github.repository }}
          gemini-model: ${{ vars.GEMINI_MODEL }}
