name: Reusable Changelog Bot

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        description: "Google Gemini API key"
        required: true
      OPENWISP_BOT_APP_ID:
        description: "GitHub App ID for OpenWISP Bot"
        required: true
      OPENWISP_BOT_PRIVATE_KEY:
        description: "Private key (prefer the openwisp-bot environment secret)"
        required: true

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    environment: openwisp-bot
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR repository
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.OPENWISP_BOT_APP_ID }}
          private-key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: read

      - name: Checkout openwisp-utils for action
        uses: actions/checkout@v7
        with:
          repository: openwisp/openwisp-utils
          ref: master
          sparse-checkout: |
            .github/actions/bot-changelog-generator
          path: openwisp-utils-action
          persist-credentials: false

      - name: Generate changelog
        uses: ./openwisp-utils-action/.github/actions/bot-changelog-generator
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          pr-number: ${{ inputs.pr_number }}
          repo-name: ${{ github.repository }}
          gemini-model: ${{ vars.GEMINI_MODEL }}
